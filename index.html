<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<title>Daily Update Hub</title>
<style>
/* Layout: Hub-style app shell — navy rail on the left (project switcher + nav), working canvas on the right with a slim hero per view. */
:root {
  --washed: #053057; --neon: #00EDED; --lt: #A2F3F3; --cool: #314550;
  --bg: #F4F3F0; --surface: #FFFFFF; --surface-2: #ECEBE6; --ink: #053057; --muted: #4B5D6A; --rule: #DCDAD3;
  --rail: #053057; --rail-ink: #F4F3F0; --rail-muted: #9DB3C4; --rail-hover: rgba(255,255,255,.07); --rail-active: rgba(0,237,237,.14);
  --accent: #053057; --accent-ink: #FFFFFF; --hilite: #A2F3F3; --hilite-ink: #053057;
  --ok: #1F7A4D; --ok-bg: #DDF2E6; --warn: #8A5A00; --warn-bg: #FBEBC8; --bad: #A12A2A; --bad-bg: #F8DEDB; --idle: #4B5D6A; --idle-bg: #E6E5DF;
  --focus: #0090A0;
  --f-display: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-data: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0D0E; --surface: #1A1A1A; --surface-2: #222628; --ink: #F4F3F0; --muted: #A9B6BF; --rule: #314550;
  --rail: #053057; --rail-ink: #F4F3F0; --rail-muted: #9DB3C4;
  --accent: #00EDED; --accent-ink: #053057; --hilite: #314550; --hilite-ink: #A2F3F3;
  --ok: #7FD9A8; --ok-bg: #12301F; --warn: #F2C46B; --warn-bg: #3A2C0D; --bad: #F29A92; --bad-bg: #3C1715; --idle: #A9B6BF; --idle-bg: #262B2E;
  --focus: #00EDED; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B0D0E; --surface: #1A1A1A; --surface-2: #222628; --ink: #F4F3F0; --muted: #A9B6BF; --rule: #314550;
  --rail: #053057; --rail-ink: #F4F3F0; --rail-muted: #9DB3C4;
  --accent: #00EDED; --accent-ink: #053057; --hilite: #314550; --hilite-ink: #A2F3F3;
  --ok: #7FD9A8; --ok-bg: #12301F; --warn: #F2C46B; --warn-bg: #3A2C0D; --bad: #F29A92; --bad-bg: #3C1715; --idle: #A9B6BF; --idle-bg: #262B2E;
  --focus: #00EDED; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-weight: 400; text-wrap: balance; margin: 0; }

.shell { display: flex; height: 100%; }
.rail { width: 236px; flex-shrink: 0; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; overflow-y: auto; }
.rail-brand { padding: 22px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); display: grid; gap: 10px; }
.rail-brand svg { width: 92px; height: auto; color: var(--rail-ink); }
.rail-app { font-size: 15px; color: var(--neon); letter-spacing: .01em; }
.rail-sub { font-size: 11px; color: var(--rail-muted); margin-top: -6px; }
.rail-proj { padding: 14px 14px 6px; display: grid; gap: 6px; }
.rail-label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--rail-muted); padding: 0 4px; }
.rail-proj select { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--rail-ink); border-radius: 8px; padding: 8px 10px; }
.rail-proj select option { color: #053057; background: #fff; }
.nav { padding: 8px 10px; display: grid; gap: 2px; flex: 1; align-content: start; }
.nav button { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; color: var(--rail-muted); cursor: pointer; font-size: 13px; }
.nav button:hover { background: var(--rail-hover); color: var(--rail-ink); }
.nav button[aria-current="page"] { background: var(--rail-active); color: var(--neon); }
.nav button:focus-visible { outline: 2px solid var(--neon); }
.nav .count:empty { display: none; }
.nav .count { font-family: var(--f-data); font-size: 11px; background: rgba(255,255,255,.1); padding: 1px 7px; border-radius: 10px; }
.rail-foot { padding: 14px 18px 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: var(--rail-muted); display: grid; gap: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--rail-muted); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--neon); }

.canvas { flex: 1; overflow-y: auto; min-width: 0; }
.hero { background: var(--washed); color: #F4F3F0; padding: 28px 36px 26px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; right: -70px; top: -90px; width: 300px; height: 190px; border: 22px solid rgba(0,237,237,.10); border-radius: 50%; pointer-events: none; }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--neon); }
.hero h1 { font-size: 30px; line-height: 1.15; margin-top: 6px; }
.hero p { margin: 8px 0 0; color: #B9CBD8; max-width: 70ch; font-size: 13.5px; }
.wrap { padding: 26px 36px 64px; max-width: 1180px; display: grid; gap: 26px; }

.sec-hd { display: flex; align-items: baseline; gap: 14px; }
.sec-hd h2 { font-size: 18px; white-space: nowrap; }
.sec-hd .line { flex: 1; height: 1px; background: var(--rule); }
.sec-hd .aside { font-size: 12px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 16px 14px; display: grid; gap: 2px; }
.stat b { font-weight: 400; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.flag { border-color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 22px; min-width: 0; }
.panel > h3 { font-size: 15px; margin-bottom: 4px; }
.panel .lead { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 75ch; }
.grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 400; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, .mono { font-family: var(--f-data); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.who { display: grid; }
.who small { color: var(--muted); font-size: 11.5px; }
.clip { max-width: 46ch; color: var(--muted); }

.chip { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; background: var(--idle-bg); color: var(--idle); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.hi { background: var(--hilite); color: var(--hilite-ink); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--ink); }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea, .inp { width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.fgrid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }

.q { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 4px 14px; padding: 18px 0; border-top: 1px solid var(--rule); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-n { width: 30px; height: 30px; border-radius: 50%; background: var(--hilite); color: var(--hilite-ink); display: grid; place-items: center; font-family: var(--f-data); font-size: 12px; }
.q-t { font-size: 16px; padding-top: 3px; }
.q-h { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.q-body { grid-column: 2; display: grid; gap: 10px; }

.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,2fr) 150px auto 34px; gap: 8px; align-items: center; }
.item.noplan { grid-template-columns: minmax(0,1fr) 170px 34px; }
.item-hd { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.x { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.x:hover { background: var(--surface-2); color: var(--bad); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--washed); }

.members { display: grid; gap: 8px; }
.member { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.5fr) 34px; gap: 8px; }

.entry { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 16px 18px; display: grid; gap: 12px; }
.entry-hd { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.entry-hd .name { font-size: 15px; }
.entry-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 22px; }
.entry-grid h4 { margin: 0 0 3px; font-weight: 400; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.entry-grid p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.day-hd { font-size: 13px; color: var(--muted); padding: 4px 2px 0; display: flex; justify-content: space-between; }
.day { display: grid; gap: 10px; }

.empty { border: 1px dashed var(--rule); border-radius: 12px; padding: 34px 26px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 18px; }
.empty p { margin: 0; max-width: 56ch; }

.banner { border-radius: 10px; padding: 12px 16px; font-size: 13px; background: var(--hilite); color: var(--hilite-ink); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }

.rules { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.rule { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.rule .when { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.rule h3 { font-size: 16px; }
.rule p { margin: 0; font-size: 13px; color: var(--muted); }

.map { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; }
.toast { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--washed); color: #F4F3F0; border-left: 3px solid var(--neon); padding: 12px 16px; border-radius: 8px; font-size: 13px; max-width: 360px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bad-bg); color: var(--bad); padding: 10px 12px; border-radius: 8px; font-size: 13px; }

@media (max-width: 960px) {
  .stats, .rules { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid2, .entry-grid { grid-template-columns: minmax(0,1fr); }
  .map { grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 760px) {
  .shell { flex-direction: column; height: auto; }
  .rail { width: 100%; }
  .rail-brand { grid-template-columns: auto 1fr; align-items: center; padding: 14px 16px; }
  .rail-sub { display: none; }
  .nav { grid-auto-flow: column; overflow-x: auto; padding: 6px 12px 10px; }
  .nav button { white-space: nowrap; }
  .rail-foot { display: none; }
  .hero { padding: 22px 16px; }
  .hero h1 { font-size: 24px; }
  .wrap { padding: 20px 16px 48px; }
  .fgrid, .fgrid.two { grid-template-columns: minmax(0,1fr); }
  .item { grid-template-columns: minmax(0,1fr) 34px; }
  .item > *:nth-child(2), .item > *:nth-child(3), .item > *:nth-child(4) { grid-column: 1; }
  .item .x { grid-row: 1; grid-column: 2; }
  .item-hd { display: none; }
  .member { grid-template-columns: minmax(0,1fr) 34px; }
  .member > *:nth-child(2), .member > *:nth-child(3) { grid-column: 1; }
  .member .x { grid-row: 1; grid-column: 2; }
  .stats, .rules { grid-template-columns: minmax(0,1fr); }
  .map { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: .4; } } }
</style>

// ---------- dates ----------
function tzOf(p) { return (p && p.timezone) || 'America/New_York'; }

function fmtShort(d) { if (!d) return '—'; return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); }

function pad(n) { return String(n).padStart(2, '0'); }
function yr(y) { y = Number(y); return y < 100 ? 2000 + y : y; }
function parseDate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
  if (typeof v === 'number') { if (v > 20000 && v < 80000) return new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10); return ''; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  m = s.match(/^(\d{1,2})[\/\-\s]([A-Za-z]{3})[A-Za-z]*[\/\-\s,]+(\d{2,4})/); if (m && MON[m[2].toLowerCase()]) return yr(m[3]) + '-' + pad(MON[m[2].toLowerCase()]) + '-' + pad(m[1]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) return yr(m[3]) + '-' + pad(m[1]) + '-' + pad(m[2]);
  const t = Date.parse(s); if (!isNaN(t)) { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  return '';
}

// ---------- derived ----------
function proj() { return S.projects.find(p => p.id === S.pid) || null; }

function updatesFor(date) { return S.updates.filter(u => u.date === date); }
function taskById(id) { return S.plan && S.plan.tasks ? S.plan.tasks.find(t => t.id === id) : null; }
function isDone(status) { return /complete|done|closed|resolved|cancel/i.test(status || ''); }
function variance(item) {
  const t = item.taskId ? taskById(item.taskId) : null;
  if (!item.eta) return { cls: '', label: 'No date' };
  if (!t || !t.end) return { cls: 'hi', label: 'Not linked' };
  const d = dayDiff(t.end, item.eta);
  if (d <= 0) return { cls: 'ok', label: d === 0 ? 'On plan date' : Math.abs(d) + 'd ahead', days: d };
  if (d <= 3) return { cls: 'warn', label: d + 'd behind plan', days: d };
  return { cls: 'bad', label: d + 'd behind plan', days: d };
}
function latestByMember() {
  const m = {};
  for (const u of S.updates) if (!m[u.memberId] || u.date > m[u.memberId].date) m[u.memberId] = u;
  return m;
}
function latestEtaByTask() {
  const r = {};

}

let DB = null;
function wrapDb(raw, prefix) { return { collection: n => raw.collection(prefix + n), doc: p => raw.doc(prefix + p) }; }
function makeLocalDb() {
  const KEY = 'duh.localdb'; let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} subs.forEach(f => f()); };
  const clone = v => JSON.parse(JSON.stringify(v));
  const snapDoc = (c, id) => { const v = data[c] && data[c][id]; return { id, exists: !!v, data: () => (v ? clone(v) : undefined) }; };
  function query(c, filters, lim) {
    const run = () => { const docs = Object.keys(data[c] || {}).filter(id => filters.every(([f, v]) => data[c][id][f] === v)).slice(0, lim || 1e9).map(id => snapDoc(c, id)); return { docs, size: docs.length, empty: !docs.length }; };
    return {
      where(f, op, v) { return query(c, filters.concat([[f, v]]), lim); },
      orderBy() { return this; }, limit(n) { return query(c, filters, n); },
      async get() { return run(); },
      onSnapshot(fn) { const f = () => fn(run()); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
    };
  }
  function doc(path) {
    const i = path.lastIndexOf('/'), c = path.slice(0, i), id = path.slice(i + 1);
    return {
      id,
      async get() { return snapDoc(c, id); },
      async set(v) { (data[c] = data[c] || {})[id] = clone(v); save(); },
      async update(v) { if (!data[c] || !data[c][id]) throw { code: 'invalid_argument' }; Object.assign(data[c][id], clone(v)); save(); },
      async delete() { if (data[c]) { delete data[c][id]; save(); } },
      onSnapshot(fn) { const f = () => fn(snapDoc(c, id)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
    };
  }
  return { collection(c) { const q = query(c, [], 0); q.doc = id => doc(c + '/' + (id || uid())); q.add = async v => { const d = doc(c + '/' + uid()); await d.set(v); return d; }; return q; }, doc };
}
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(el); }); }

// ---------- email drafts (the sender reviews and hits Send) ----------
function appLink() { return S.mode === 'claude' ? CLAUDE_LINK : APP_LINK; }
function outlookUrl(d) {
  const q = [];
  if (d.to && d.to.length) q.push('to=' + encodeURIComponent(d.to.join(';')));
  if (d.cc && d.cc.length) q.push('cc=' + encodeURIComponent(d.cc.join(';')));

  q.push('subject=' + encodeURIComponent(d.subject)); q.push('body=' + encodeURIComponent(d.body));
  return 'https://outlook.office.com/mail/deeplink/compose?' + q.join('&');
}
function mailtoUrl(d) {
  const q = [];
  if (d.cc && d.cc.length) q.push('cc=' + encodeURIComponent(d.cc.join(',')));
  if (d.bcc && d.bcc.length) q.push('bcc=' + encodeURIComponent(d.bcc.join(',')));

function firstName(n) { return String(n || '').trim().split(/\s+/)[0] || 'there'; }
function leadDraft(p, u, edited) {
  const items = (u.items || []).filter(it => it.name || it.eta).map(it => { const v = variance(it); return `- ${it.name || 'Item'}: expected ${fmtShort(it.eta)}${PLAN_ENABLED && it.planEnd ? ` (plan ${fmtShort(it.planEnd)}, ${v.label})` : ''}`; }).join('\n');

  return { kind: 'lead_update', title: `Let ${firstName(p.lead.name)} know`, desc: `Your update is saved. Send this email so ${p.lead.name} sees it now.`, to: [p.lead.email], cc: [], bcc: [], subject: `${u.helpNeeded ? '[Help needed] ' : ''}${p.name}: ${u.memberName}, daily update ${fmtShort(u.date)}`, body: body.slice(0, 6000) };
}
function morningDraft(p) {
  const today = todayIn(tzOf(p)), link = appLink();
  const to = members(p).map(m => m.email).filter(e => e && e.toLowerCase() !== (p.lead.email || '').toLowerCase());

  return { kind: 'morning', date: today, title: 'Morning reminder', desc: `Goes to ${to.length} team member${to.length === 1 ? '' : 's'}.`, to, cc: [], bcc: [], subject: `[${p.name}] Daily update due today, ${fmtDay(today)}`, body };
}
function missingMembers(p) { const today = todayIn(tzOf(p)); return members(p).filter(m => !S.updates.some(u => u.date === today && u.memberId === m.mid)); }

  return { kind: 'midday', date: today, title: 'Midday nudge', desc: `Goes to the ${miss.length} people who haven't submitted, with ${p.lead.name} copied.`, to: miss.map(m => m.email), cc: [p.lead.email], bcc: [], subject: `[${p.name}] Reminder: today's update is still missing`, body };

  const d = S.draft; if (!d) return '';

  return `<section class="panel draft" style="display:grid;gap:12px;border-color:var(--accent)">

function viewToday(main, p) {
  if (!p) { hero('Daily Update Hub', 'No project selected', 'Create a project to start capturing daily updates.'); main.innerHTML = emptyProject(); return; }
  const tz = tzOf(p), today = todayIn(tz), ms = members(p);
  const todays = updatesFor(today);
  const help = todays.filter(u => u.helpNeeded || (u.blockers || '').trim());
  const latest = latestByMember();
  let behind = 0;
  Object.values(latest).forEach(u => (u.items || []).forEach(it => { const v = variance(it); if (v.days > 0) behind++; }));
  const tasks = (S.plan && S.plan.tasks) || [];
  const horizon = addDays(today, 7);
  const watch = tasks.filter(t => t.end && !isDone(t.status) && t.end <= horizon).sort((a, b) => a.end < b.end ? -1 : 1);
  const overdue = watch.filter(t => t.end < today).length;
  const dueItems = [];
  Object.values(latest).forEach(u => (u.items || []).forEach(it => { if (it.eta && it.eta <= horizon) dueItems.push({ ...it, who: u.memberName, from: u.date }); }));
  dueItems.sort((a, b) => a.eta < b.eta ? -1 : 1);
  const pastDue = dueItems.filter(it => it.eta < today).length;
  hero(`${p.client ? p.client + ' · ' : ''}${fmtDay(today)}`, p.name, `Delivery lead <b style="color:#fff;font-weight:400">${esc(p.lead && p.lead.name)}</b> · ${ms.length} team member${ms.length === 1 ? '' : 's'} ${PLAN_ENABLED ? ' · ' + (S.plan ? `Plan: ${esc(S.plan.sourceName || 'imported')} (${tasks.length} tasks)` : 'No project plan connected yet') : ''}`);

  const rows = ms.map(m => {
    const st = memberStatus(m, p);
    return `<tr><td><div class="who">${esc(m.name)}<small>${esc(m.role)}</small></div></td>
      <td><span class="chip ${st.cls}">${st.label}</span></td>
      <td class="num">${st.u ? esc(fmtTime(st.u.submittedAt, tz)) : '—'}</td>
      <td class="clip">${st.u ? esc((st.u.working || '').slice(0, 140)) : ''}</td>
      <td>${st.u ? `<button class="btn sm ghost" data-viewentry="${esc(st.u.id)}">Read</button>` : (st.cls !== '' ? `<button class="btn sm ghost" data-submitfor="${esc(m.mid)}">Enter</button>` : '')}</td></tr>`;
  }).join('');

  const blockers = help.length ? help.map(u => `<div class="entry"><div class="entry-hd"><span class="name">${esc(u.memberName)}</span>${u.helpNeeded ? '<span class="chip bad">Help requested</span>' : '<span class="chip warn">Blocker noted</span>'}</div><p style="margin:0;white-space:pre-wrap">${esc(u.blockers || '(no detail given)')}</p></div>`).join('') : `<p class="lead" style="margin:0">No blockers reported today.</p>`;

  const etas = latestEtaByTask();
  const watchRows = watch.slice(0, 12).map(t => {
    const e = etas[t.id];
    const lateChip = t.end < today ? '<span class="chip bad">Past plan date</span>' : `<span class="chip">${dayDiff(today, t.end)}d left</span>`;

function reminderCue(p) {
  const tz = tzOf(p), today = todayIn(tz), h = hourIn(tz);
  if (isWeekend(today) || S.draft) return '';
  const miss = missingMembers(p).length;
  if (h >= 12 && miss && !draftedToday(p, 'midday')) return `<div class="banner bad row" style="justify-content:space-between">${miss} update${miss === 1 ? ' is' : 's are'} still missing at midday. <button class="btn sm" type="button" data-mkdraft="midday">Draft the nudge</button></div>`;
  if (h >= 7 && h < 12 && miss && !draftedToday(p, 'morning')) return `<div class="banner row" style="justify-content:space-between">Today's morning reminder hasn't gone out yet. <button class="btn sm" type="button" data-mkdraft="morning">Draft the reminder</button></div>`;
  return '';
}
function viewSubmit(main, p) {

  if (!mid && S.me.email) { const hit = ms.find(m => (m.email || '').toLowerCase() === S.me.email.toLowerCase()); if (hit) mid = hit.mid; }
  if (!mid && S.me.name) { const n = S.me.name.trim().toLowerCase(); const hit = ms.find(m => (m.name || '').trim().toLowerCase() === n); if (hit) mid = hit.mid; }
  if (!mid && ms[0]) mid = '';
  const existing = S.updates.find(u => u.date === date && u.memberId === mid);

      <div class="field"><span class="lbl">Last update</span><div style="padding:9px 0;color:var(--muted)">${prev ? esc(fmtDay(prev.date)) : 'None yet'}</div></div>

        ${q.key === 'items' ? `<div class="items">${PLAN_ENABLED ? '<div class="item item-hd"><span>Deliverable</span><span>Plan task</span><span>Expected delivery</span><span>vs. plan</span><span></span></div>' : '<div class="item noplan item-hd"><span>Deliverable</span><span>Expected delivery</span><span></span></div>'}${itemsHtml}</div><div><button type="button" class="btn sm" id="addItem">+ Add deliverable</button></div>`

function previewTasks(pv) {
  const g = (r, k) => pv.map[k] === '' || pv.map[k] == null ? '' : r[pv.map[k]];
  return pv.rows.map((r, i) => ({
    id: String(g(r, 'id') || (pv.rowIds && pv.rowIds[i]) || 'n' + hash(String(g(r, 'name')) + '|' + i)).slice(0, 80),
    name: String(g(r, 'name') || '').trim().slice(0, 200),
    owner: String(g(r, 'owner') || '').trim().slice(0, 80),
    start: parseDate(g(r, 'start')), end: parseDate(g(r, 'end')),
    status: String(g(r, 'status') || '').trim().slice(0, 40)
  })).filter(t => t.name).slice(0, 1200);
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function guessMap(headers) {
  const find = (re, not) => { const i = headers.findIndex(h => re.test(h) && !(not && not.test(h))); return i < 0 ? '' : i; };
  return {
    name: find(/^(task ?name|summary|task|name|title|deliverable|milestone)$/i) !== '' ? find(/^(task ?name|summary|task|name|title|deliverable|milestone)$/i) : find(/task|summary|name|title/i),
    owner: find(/assign|owner|assignee|resource/i),
    start: find(/start/i),
    end: find(/^(end|finish|due)|end date|due date|finish|target/i),
    status: find(/^status$/i) !== '' ? find(/^status$/i) : find(/status|state/i, /category/i),
    id: find(/^(issue key|key|issue id|id|row id)$/i)
  };
}

// ---------- writes ----------
function writeErr(err) {
  const c = err && err.code;
  if (c === 'invalid_argument') { S.canWrite = false; render(); return 'You don’t have permission to save to this app. Ask the owner for Contributor access.'; }
  if (c === 'permission-denied') return 'Firebase is blocking saves. Check the Firestore rules (see the setup steps).';
  if (c === 'quota_exceeded' || c === 'resource-exhausted') return 'The app’s storage is full. Ask the owner to archive old projects.';
  return 'Couldn’t save just now. Check your connection and try again.';
}
async function saveProject() {
  syncSetup();
  const d = S.setupDraft;
  if (!S.db) return toast('Shared data isn’t connected in this view.');
  if (!d.name || !d.lead.name || !d.lead.email) return toast('Project name, lead name and lead email are required.');
  if (d._leadIsMember) d.members.unshift({ mid: uid(), name: d.lead.name, role: d.lead.role || 'Delivery Lead', email: d.lead.email });
  d.members = d.members.filter(m => m.name || m.email).map(m => ({ mid: m.mid || uid(), name: m.name, role: m.role, email: m.email }));
  const bad = d.members.find(m => !m.name || !/^\S+@\S+\.\S+$/.test(m.email));
  if (bad) return toast(`Each team member needs a name and a valid email (check ${bad.name || bad.email || 'the empty row'}).`);
  const isNew = !d.id;
  const id = d.id || (d.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'project') + '-' + uid().slice(0, 5);
  const body = { name: d.name, client: d.client, start: d.start, end: d.end, timezone: d.timezone, lead: d.lead, members: d.members, alerts: d.alerts || { morning: true, midday: true, lead: true }, active: true, updatedAt: new Date().toISOString(), createdAt: d.createdAt || new Date().toISOString(), createdBy: d.createdBy || S.me.id || null };
  try {
    await DB.doc('projects/' + id).set(body);
    S.pid = id; store.set('duh.pid', id); S.setupDraft = null; S.confirmDelete = false;
    subscribeProject();
    toast(isNew ? `Created ${d.name}. Share this app with the team so they can submit.` : 'Project saved.');
    go(isNew ? 'today' : 'setup');
  } catch (err) { toast(writeErr(err)); }
}
async function deleteUpdate(id) {
  if (!S.db) return;
  try { await DB.doc('updates/' + id).delete(); S.confirmUpdate = null; toast('Update deleted.'); render(); }
  catch (err) { S.confirmUpdate = null; render(); toast(writeErr(err)); }
}
async function deleteProject(id) {
  const p = S.projects.find(x => x.id === id); if (!p || !S.db) return;
  try {
    for (const col of ['updates', 'outbox']) {
      const snap = await DB.collection(col).where('projectId', '==', id).limit(1000).get();
      for (let i = 0; i < snap.docs.length; i += 10) await Promise.all(snap.docs.slice(i, i + 10).map(d => DB.doc(col + '/' + d.id).delete()));
    }
    await DB.doc('plans/' + id).delete();
    await DB.doc('projects/' + id).delete();
    if (S.pid === id) { S.pid = null; store.set('duh.pid', ''); }
    S.setupDraft = null; S.confirmDelete = false;
    toast(`Deleted ${p.name}.`); go(S.projects.length > 1 ? 'setup' : 'today');
  } catch (err) { S.confirmDelete = false; render(); toast(writeErr(err)); }
}

async function submitUpdate() {

  const items = S.draftItems.filter(it => (it.name || '').trim() || it.taskId).map(it => { const t = it.taskId ? taskById(it.taskId) : null; return { name: (it.name || (t && t.name) || '').trim().slice(0, 200), taskId: it.taskId || '', taskName: t ? t.name : '', planEnd: t ? t.end : '', eta: it.eta || '' }; });
  const id = `${p.id}_${date}_${mid}`.replace(/[^A-Za-z0-9_\-.]/g, '-');

  const body = { projectId: p.id, memberId: mid, memberName: m.name, memberRole: m.role, memberEmail: m.email, date, working, progress: $('#q-progress').value.trim(), blockers: $('#q-blockers').value.trim(), helpNeeded: $('#q-help').checked, items, submittedAt: existing ? existing.submittedAt : now, submittedBy: S.me.id || null };

  S.draftItems = null; S.draftText = null; S.editDate = null; S.editMember = null;

// ---------- plan import ----------
async function readPlanFile(file) {
  if (!window.XLSX) return toast('The spreadsheet reader didn’t load. Reload the page and try again.');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const hi = grid.findIndex(r => r.filter(c => String(c).trim()).length >= 3);
    if (hi < 0) return toast('No header row found in that file.');
    const headers = grid[hi].map(h => String(h).trim() || '(blank)');
    const rows = grid.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
    const jira = headers.some(h => /^issue key$/i.test(h));
    S.importPreview = { source: jira ? 'jira' : 'file', sourceName: file.name, sourceUrl: '', headers, rows, map: guessMap(headers), sampled: false };
    render();
  } catch (err) { toast('Couldn’t read that file. Export it again as .csv or .xlsx.'); }
}
async function syncSmartsheet() {
  const url = $('#ssUrl').value.trim(), msg = $('#ssMsg');
  if (!/smartsheet\.com/i.test(url)) return toast('Paste a Smartsheet sheet link (app.smartsheet.com/sheets/…).');
  if (!S.mcp) return;
  msg.textContent = 'Reading columns…';
  try {
    const cols = await S.mcp.callTool('Smartsheet', 'get_columns', { url }, { cache: false });
    const list = ((cols.payload && cols.payload.data) || []).map(c => c.title);
    const m = guessMap(list);
    const pick = Object.values(m).filter(i => i !== '').map(i => list[i]);
    if (!pick.length) { msg.textContent = ''; return toast('No task or date columns found in that sheet.'); }
    msg.textContent = 'Reading rows…';
    const res = await S.mcp.callTool('Smartsheet', 'get_sheet_summary', { url, columns: Array.from(new Set(pick)) }, { cache: false });
    const pl = res.payload || {};
    const avail = (pl.availableColumns || []);
    const headers = avail.map(c => c.title);
    const idxOf = {}; avail.forEach((c, i) => { idxOf[c.index] = i; });
    const rows = (pl.rows || []).map(r => { const a = headers.map(() => ''); (r.cells || []).forEach(c => { if (idxOf[c.columnIndex] != null) a[idxOf[c.columnIndex]] = c.value; }); return a; });
    const rowIds = (pl.rows || []).map(r => String(r.rowId || ''));
    S.importPreview = { source: 'smartsheet', sourceName: pl.sheetName || 'Smartsheet', sourceUrl: url, headers, rows, rowIds, map: guessMap(headers), sampled: !!(pl.metadata && pl.metadata.isSampled) };
    msg.textContent = '';
    render();
  } catch (err) {
    msg.textContent = '';
    const c = err && err.code;
    if (c === 'server_not_connected') toast('Add the Smartsheet connector in claude.ai Settings → Connectors, then try again.');
    else if (c === 'needs_reauth') toast('Reconnect Smartsheet in claude.ai Settings → Connectors.');
    else if (c === 'not_in_manifest' || c === 'approval_required') toast('Smartsheet access wasn’t allowed for this app. Allow it from the app’s permissions to sync.');
    else if (c === 'tool_error') toast('Smartsheet couldn’t open that sheet. Check the link and that you have access to it.');
    else toast('Smartsheet didn’t respond. Try again in a moment.');
  }
}
async function savePlan() {
  const p = proj(), pv = S.importPreview; if (!p || !pv || !S.db) return;
  if (pv.map.name === '' || pv.map.end === '') return toast('Map at least the task name and end date columns.');
  const tasks = previewTasks(pv);
  const body = { projectId: p.id, source: pv.source, sourceName: pv.sourceName, sourceUrl: pv.sourceUrl || '', importedAt: new Date().toISOString(), sampled: !!pv.sampled, tasks };
  try { await DB.doc('plans/' + p.id).set(body); S.importPreview = null; toast(`Plan saved with ${tasks.length} tasks.`); render(); }
  catch (err) { toast(err && err.code === 'invalid_argument' && S.canWrite !== false ? 'That plan is too large to store. Filter it to the active phase and import again.' : writeErr(err)); }
}

// ---------- data wiring ----------
function selectProject(id) { S.pid = id || null; store.set('duh.pid', id || ''); S.setupDraft = null; S.importPreview = null; S.draftItems = null; S.editMember = null; S.editDate = null; S.logFilter = { member: '', q: '', from: '', to: '' }; subscribeProject(); render(); }
function subscribeProject() {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.updates = []; S.plan = null; S.outbox = [];
  if (!S.db || !S.pid) return;
  const pid = S.pid;
  S.unsub.push(DB.collection('updates').where('projectId', '==', pid).onSnapshot(snap => { if (S.pid !== pid) return; S.updates = snap.docs.map(d => ({ id: d.id, ...d.data() })); softRender(); }, dbErr));
  S.unsub.push(DB.doc('plans/' + pid).onSnapshot(snap => { if (S.pid !== pid) return; S.plan = snap.exists ? snap.data() : null; softRender(); }, dbErr));
  S.unsub.push(DB.collection('outbox').where('projectId', '==', pid).limit(300).onSnapshot(snap => { if (S.pid !== pid) return; S.outbox = snap.docs.map(d => ({ id: d.id, ...d.data() })); softRender(); }, dbErr));
}
// Avoid wiping half-typed forms when live data arrives.
function softRender() {
  if ((S.view === 'submit' && $('#upForm')) || (S.view === 'setup' && $('#setupForm'))) { const c = $('#cToday'), p = proj(); if (c && p) c.textContent = `${updatesFor(todayIn(tzOf(p))).length}/${members(p).length}`; return; }
  if (S.view === 'log' && document.activeElement && document.activeElement.id === 'fQ') return;
  render();
}
function dbErr(err) {
  $('#dbDot').className = 'dot';
  const c = err && err.code;
  $('#dbState').textContent = c === 'revoked' ? 'Access changed; reload' : c === 'permission-denied' ? 'Firebase rules are blocking access' : 'Live sync paused; reload to retry';
  if (c === 'permission-denied' && !S.dbReady) { S.dbReady = true; render(); $('#main').insertAdjacentHTML('afterbegin', '<div class="banner bad">The Firebase database is refusing access. Its security rules still need to allow the Daily Update Hub collections (duh_projects, duh_updates, duh_plans, duh_outbox).</div>'); }
}

async function boot() {
  const v = store.get('duh.view'); if (v) S.view = v;
  if (!PLAN_ENABLED) { const nb = document.querySelector('#nav [data-view="plan"]'); if (nb) nb.remove(); if (S.view === 'plan') S.view = 'today'; }
  S.pid = store.get('duh.pid') || null;
  render();
  let db = null, user = null, mcp = null;
  if (window.claude && window.claude.use) [db, user, mcp] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('mcp')]);
  const dot = $('#dbDot'), st = $('#dbState');
  if (db) {
    S.mode = 'claude'; DB = wrapDb(db, ''); S.user = user; S.mcp = mcp;
    if (user) {
      const me = await user.me(); S.me = { id: me.id, email: me.email, name: me.name };
      S.canWrite = await user.can('data.write');
      $('#footWho').textContent = 'Signed in as ' + (me.name || me.email || 'you');
    }
    dot.className = 'dot on'; st.textContent = 'Live · shared with your team';
  } else if (FIREBASE_CONFIG.projectId) {
    try {
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);
      const fs = firebase.firestore(); try { fs.settings({ ignoreUndefinedProperties: true }); } catch (e) {} DB = wrapDb(fs, FIRESTORE_PREFIX); S.mode = 'firebase';
      dot.className = 'dot on'; st.textContent = 'Live · shared with your team';
      $('#footWho').textContent = 'Blend Share edition';
    } catch (e) {
      DB = wrapDb(makeLocalDb(), ''); S.mode = 'local';
      st.textContent = 'Couldn’t reach Firebase; saving in this browser';
    }
  } else {
    DB = wrapDb(makeLocalDb(), ''); S.mode = 'local';
    st.textContent = 'Preview · saved in this browser only';
    $('#footWho').textContent = 'Preview mode';
  }
  S.db = DB;
  DB.collection('projects').onSnapshot(snap => {
    S.projects = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.active !== false).sort((a, b) => a.name.localeCompare(b.name));
    const first = !S.dbReady; S.dbReady = true;
    if (!S.pid || !S.projects.some(p => p.id === S.pid)) {
      const keepNew = S.view === 'setup' && S.setupDraft && !S.setupDraft.id;
      if (!keepNew) { S.pid = S.projects[0] ? S.projects[0].id : null; subscribeProject(); }
    } else if (first) subscribeProject();
    if (!S.projects.length && first) { S.view = 'setup'; S.setupDraft = blankProject(); }
    softRender();
  }, dbErr);
}
boot();
})();
</script>
